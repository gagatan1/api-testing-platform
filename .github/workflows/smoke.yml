name: Smoke tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * 1-5'  # будни 10:00

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: cp .env.staging .env
      - run: npm run test:smoke